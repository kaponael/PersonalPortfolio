    <div class="content">
        <h1 class="header">CONTACT ME</h1>
        <div class="mainpart">
            <form name="contact" method="POST" data-netlify="true">
                <input type="hidden" name="form-name" value="contact">
                <div>
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Name Surname" required>
                </div>
                <div>
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="youremail@example.com" required pattern="[^@]+@[^@]+\.[^@]+" title="Please enter a valid email address.">
                </div>
                <div>
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required minlength="10"></textarea>
                </div>
                <input type="submit" value="Send">
            </form>
